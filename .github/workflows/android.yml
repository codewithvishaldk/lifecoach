
name: LifeCoach Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LifeCoach APK and AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LifeCoach

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK and accept licenses
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 4. Setup Gradle 8.7
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. Check project structure
      - name: Verify Project
        run: |
          echo "Checking LifeCoach project..."
          ls -la
          echo "Checking app module..."
          ls -la app

      # 6. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 7. Build Release AAB
      - name: Build Release AAB
        run: gradle bundleRelease --stacktrace

      # 8. Upload generated files
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LifeCoach-Android-Files
          path: |
            LifeCoach/app/build/outputs/apk/debug/*.apk
            LifeCoach/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
