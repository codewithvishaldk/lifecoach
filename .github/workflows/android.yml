
name: LifeCoach Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LifeCoach APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Project Structure
        run: |
          echo "Repository root:"
          pwd
          ls -la
          echo "Searching for Gradle build files:"
          find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release AAB
        run: gradle bundleRelease --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LifeCoach-Android-Files
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
