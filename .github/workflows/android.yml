
name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LifeCoach

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project files
        run: |
          ls -la
          gradle --version

      - name: Build APK
        run: gradle assembleDebug

      - name: Build AAB
        run: gradle bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LifeCoach-Build
          path: |
            LifeCoach/app/build/outputs/apk/debug/*.apk
            LifeCoach/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
